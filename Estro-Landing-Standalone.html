  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  --shadow-lg: 0 10px 30px rgba(11,11,12,.10), 0 40px 80px rgba(11,11,12,.12);\n  --shadow-mag: 0 14px 34px rgba(230,0,90,.30);\n\n  --ease: cubic-bezier(.22,.61,.36,1);\n  --ease-out: cubic-bezier(.16,1,.3,1);\n}\n\n/* ============================================================ RESET */\n*, *::before, *::after { box-sizing: border-box; }\n* { margin: 0; padding: 0; }\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after {\n    animation-duration: .001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important;\n  }\n}\nbody {\n  font-family: var(--font-body);\n  background: var(--paper);\n  color: var(--t-ink);\n  line-height: 1.55;\n  font-size: 18px;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\nimg, svg, video { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }\nul { list-style: none; }\ninput, textarea, select { font: inherit; color: inherit; }\n::selection { background: var(--magenta); color: #fff; }\n\n/* Skip link */\n.skip-link {\n  position: absolute; left: 12px; top: -60px; z-index: 200;\n  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: var(--radius);\n  transition: top .2s var(--ease);\n}\n.skip-link:focus { top: 12px; }\n\n:focus-visible {\n  outline: 2px solid var(--magenta);\n  outline-offset: 3px;\n  border-radius: 2px;\n}\n\n/* ============================================================ LAYOUT */\n.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }\n.section { padding-block: var(--section-y); position: relative; }\n\n.section--dark  { background: var(--ink); color: var(--t-paper); }\n.section--ink2  { background: var(--ink-2); color: var(--t-paper); }\n.section--paper { background: var(--paper); color: var(--t-ink); }\n.section--soft  { background: var(--paper-soft); color: var(--t-ink); }\n\n/* ============================================================ TYPE */\n.eyebrow {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  letter-spacing: .22em;\n  text-transform: uppercase;\n  font-weight: 700;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  color: var(--magenta);\n}\n.eyebrow::before {\n  content: \"\";\n  width: 26px; height: 1px;\n  background: currentColor;\n  opacity: .55;\n}\n.eyebrow--center { justify-content: center; }\n\n.display {\n  font-family: var(--font-display);\n  font-weight: 800;\n  line-height: 0.98;\n  letter-spacing: -0.028em;\n  text-wrap: balance;\n}\n.h-hero  { font-size: clamp(30px, 4.4vw, 58px); line-height: 1.02; }\n.h1      { font-size: clamp(34px, 5.4vw, 76px); }\n.h2      { font-size: clamp(28px, 3.6vw, 50px); font-weight: 800; letter-spacing: -.022em; line-height: 1.02; font-family: var(--font-display); text-wrap: balance; }\n.h3      { font-size: clamp(21px, 2vw, 27px); font-weight: 700; letter-spacing: -.015em; line-height: 1.12; font-family: var(--font-display); }\n\n.lede {\n  font-size: clamp(18px, 1.7vw, 23px);\n  line-height: 1.5;\n  color: var(--t-ink-soft);\n  font-weight: 400;\n  text-wrap: pretty;\n  max-width: 60ch;\n}\n.section--dark .lede, .section--ink2 .lede { color: var(--t-paper-soft); }\n.muted { color: var(--t-ink-soft); }\n.section--dark .muted { color: var(--t-paper-soft); }\n.mag { color: var(--magenta); }\n\n/* Section heading block */\n.head { max-width: 64ch; }\n.head .h2 { margin-top: 18px; }\n.head .lede { margin-top: 20px; }\n.head--center { margin-inline: auto; text-align: center; }\n.head--center .eyebrow { justify-content: center; }\n.head--center .lede { margin-inline: auto; }\n\n/* ============================================================ BUTTONS */\n.btn {\n  --bg: var(--magenta);\n  --fg: #fff;\n  position: lor: var(--t-paper-soft); }\n\n/* ---------------------------------------------- HYBRID compare */\n.compare { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px,1.8vw,26px); }\n.col-card { border-radius: var(--radius-xl); padding: clamp(26px,3vw,44px); position: relative; overflow: hidden; }\n.col-card--ai { background: linear-gradient(165deg, var(--magenta), var(--magenta-deep)); color: #fff; box-shadow: var(--shadow-mag); }\n.col-card--real { background: var(--paper); border: 1px solid var(--paper-line); box-shadow: var(--shadow-md); }\n.col-card .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; opacity: .9; }\n.col-card .ctit { font-family: var(--font-display); font-size: clamp(26px,2.6vw,38px); font-weight: 800; letter-spacing: -.02em; margin: 10px 0 6px; }\n.col-card .csub { font-size: 16px; opacity: .8; margin-bottom: 26px; }\n.col-card--ai .csub { opacity: .85; }\n.clist { display: grid; gap: 2px; }\n.clist li { display: flex; align-items: center; gap: 14px; padding: 15px 0; font-weight: 600; font-size: 17px; border-top: 1px solid rgba(0,0,0,.08); }\n.col-card--ai .clist li { border-color: rgba(255,255,255,.18); }\n.clist .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }\n\n/* ---------------------------------------------- RESULTS */\n.result-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 0; }\n.result { padding: clamp(26px,3vw,40px) 24px; border-right: 1px solid var(--line-dark); position: relative; }\n.result:last-child { border-right: 0; }\n.result .ri { width: 40px; height: 40px; border-radius: 50%; background: rgba(230,0,90,.16); color: var(--magenta); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }\n.result p { font-family: var(--font-display); font-size: clamp(18px,1.6vw,21px); font-weight: 700; letter-spacing: -.01em; line-height: 1.12; color: #fff; }\n\n/* ---------------------------------------------- IMPACT */\n.metric-band { display: grid; grid-template-columns: repeat(4,1fr); gap: clamp(14px,1.5vw,22px); }\n.metric {\n  background: var(--paper); border: 1px solid var(--paper-line); border-radius: var(--radius-lg);\n  padding: clamp(26px,2.6vw,40px); box-shadow: var(--shadow-sm);\n  transition: transform .5s var(--ease-out), box-shadow .5s var(--ease-out);\n}\n.metric:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }\n.metric .num { font-family: var(--font-display); font-weight: 800; font-size: clamp(46px,5.2vw,76px); letter-spacing: -.04em; line-height: .9; color: var(--ink); display: flex; align-items: baseline; }\n.metric .num .suf { color: var(--magenta); font-size: .55em; margin-left: 2px; }\n.metric .mlabel { margin-top: 16px; font-size: 15.5px; color: var(--t-ink-soft); max-width: 26ch; }\n.metric .mtag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--t-ink-faint); margin-bottom: 14px; }\n.placeholder-note { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--magenta); border: 1px dashed rgba(230,0,90,.4); padding: 7px 12px; border-radius: 999px; }\n\n/* case studies */\n.case-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: clamp(16px,1.8vw,24px); }\n.case {\n  position: relative; border-radius: var(--radius-xl); overflow: hidden;\n  background: var(--ink-3); border: 1px solid var(--line-dark); min-height: 380px;\n  display: flex; flex-direction: column; justify-content: flex-end;\n  transition: transform .5s var(--ease-out), box-shadow .5s var(--ease-out);\n}\n.case:hover { transform: translateY(-6px); box-shadow: 0 30px 70px rgba(0,0,0,.45); }\n.case__img { position: absolute; inset: 0; z-index: 0; }\n.case__img img { width: 100%; height: 100%; object-fit: cover; opacity: .5; transition: transform 1s var(--ease-out), opacity .5s; }\n.case:hover .case__img img { transform: scale(1.06); opacity: .62; }\n.case__ph { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; background:\n  repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 12px, transparent 12px 24px), var(--ink-3); }\n.case__ph svg { width: 64px; height: 64px; opacity: .14; }\n.case__scrim { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(11,11,12,0) 30%, rgba(11,11,12,.9) 100%); }\n.case__body { position: relative; z-index: 2; padding: 28px; }\n.case .ctag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }\n.case h4 { font-family: var(--font-display); font-size: 23px; font-weight: 800; letter-spacing: -.015em; color: #fff; margin: 12px 0 8px; }\n.case p { font-size: 14.5px; color: var(--t-paper-soft); }\n.case .cta-mini { margin-top: 18px; font-size: 13px; font-weight: 700; color: #fff; display: inline-flex; gap: 8px; align-items: center; opacity: .7; }\n\n/* ---------------------------------------------- FINAL CTA / FORM */\n.cta-final { position: relative; overflow: hidden; }\n.cta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(36px,5vw,90px); align-items: center; }\n.assure { display: grid; gap: 16px; margin-top: 34px; }\n.assure li { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 500; }\n.assure .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--magenta); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }\n.assure .tick svg { width: 13px; height: 13px; }\n\n.form-card {\n  background: var(--paper); color: var(--t-ink);\n  border-radius: var(--radius-xl); padding: clamp(28px,3.2vw,48px);\n  box-shadow: var(--shadow-lg); position: relative; overflow: hidden;\n}\n.form-card .fc-head h3 { font-family: var(--font-display); font-size: clamp(24px,2.4vw,32px); font-weight: 800; letter-spacing: -.02em; }\n.form-card .fc-head p { color: var(--t-ink-soft); margin-top: 8px; font-size: 16px; }\n.form { margin-top: 26px; display: grid; gap: 16px; }\n.field { position: relative; }\n.field.col-span { grid-column: 1 / -1; }\n.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n.field label { display: block; font-size: 13px; font-weight: 600; color: var(--t-ink-soft); margin-bottom: 7px; }\n.field label .req { color: var(--magenta); }\n.input {\n  width: 100%; padding: 14px 16px; font-size: 16px;\n  background: var(--paper-soft); border: 1px solid var(--paper-line); border-radius: 10px;\n  transition: border-color .25s var(--ease), background .25s, box-shadow .25s;\n}\n.input::placeholder { color: var(--t-ink-faint); }\n.input:focus { outline: none; border-color: var(--magenta); background: #fff; box-shadow: 0 0 0 4px rgba(230,0,90,.12); }\ntextarea.input { resize: vertical; min-height: 96px; }\n.input[aria-invalid=\"true\"] { border-color: #E0143C; box-shadow: 0 0 0 4px rgba(224,20,60,.12); }\n.err-msg { display: none; color: #C20E33; font-size: 12.5px; margin-top: 6px; font-weight: 600; }\n.input[aria-invalid=\"true\"] ~ .err-msg { display: block; }\n.form .btn { width: 100%; justify-content: center; margin-top: 6px; }\n.form .fineprint { font-size: 12.5px; color: var(--t-ink-faint); text-align: center; line-height: 1.5; }\n.form .fineprint a { color: var(--magenta); text-decoration: underline; text-underline-offset: 2px; }\n\n.form-success {\n  position: absolute; inset: 0; z-index: 5; background: var(--paper);\n  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;\n  padding: 40px; gap: 14px;\n  opacity: 0; visibility: hidden; transform: scale(.98);\n  transition: opacity .5s var(--ease), transform .5s var(--ease-out), visibility .5s;\n}\n.form-success.show { opacity: 1; visibility: visible; transform: none; }\n.form-success .check { width: 76px; height: 76px; border-radius: 50%; background: var(--magenta); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-mag); }\n.form-success .check svg { width: 36px; height: 36px; }\n.form-success h3 { font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -.02em; }\n.form-success p { color: var(--t-ink-soft); max-width: 34ch; }\n\n/* big magenta CTA backdrop word */\n.cta-final .ghost-word {\n  position: absolute; right: -2%; bottom: -8%; z-index: 0;\n  font-family: var(--font-display); font-weight: 800; font-size: 28vw; line-height: .8;\n  color: rgba(255,255,255,.03); letter-spacing: -.04em; pointer-events: none; user-select: none;\n}\n\n/* ---------------------------------------------- FOOTER */\n.footer { background: var(--ink); color: #fff; padding-block: clamp(56px,7vw,90px) 36px; }\n.foot-top { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: clamp(24px,3vw,48px); }\n.foot-brand img { height: 32px; margin-bottom: 22px; }\n.foot-brand p { color: var(--t-paper-soft); max-width: 38ch; font-size: 15.5px; }\n.foot-soc { display: flex; gap: 10px; margin-top: 24px; }\n.foot-soc a { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-dark); display: flex; align-items: center; justify-content: center; transition: background .3s, border-color .3s, transform .3s; }\n.foot-soc a:hover { background: var(--magenta); border-color: var(--magenta); transform: translateY(-3px); }\n.foot-soc svg { width: 17px; height: 17px; }\n.foot-col h5 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--t-paper-faint); margin-bottom: 18px; }\n.foot-col a, .foot-col span { display: block; color: var(--t-paper-soft); font-size: 15px; padding: 6px 0; transition: color .25s; }\n.foot-col a:hover { color: #fff; }\n.foot-bottom { margin-top: clamp(40px,5vw,64px); padding-top: 26px; border-top: 1px solid var(--line-dark-2); display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; }\n.foot-bottom small { color: var(--t-paper-faint); font-size: 13px; }\n.foot-bottom .legal { display: flex; gap: 22px; }\n.foot-bottom .legal a { color: var(--t-paper-faint); font-size: 13px; transition: color .25s; }\n.foot-bottom .legal a:hover { color: #fff; }\n\n/* peeking cat decoration */\n.cat-peek { position: absolute; z-index: 2; pointer-events: none; }\n.cat-peek img { width: 100%; height: auto; }\n\n/* counter-reuse: marquee tail divider */\n.tail-divider { position: relative; height: 0; }\n.tail-divider img { position: absolute; right: 4%; top: -60px; width: clamp(160px,22vw,300px); opacity: .9; pointer-events: none; }\n<\u002Fstyle>\n<style>/* ============================================================\n   ESTRO — responsive\n   ============================================================ */\n\n@media (max-width: 1080px) {\n  .svc__title { font-size: 28px; }\n  .foot-top { grid-template-columns: 1fr 1fr; gap: 36px; }\n  .foot-brand { grid-column: 1 / -1; }\n}\n\n@media (max-width: 920px) {\n  .nav, .header-cta .btn { display: none; }\n  .nav-toggle { display: flex; }\n  .header-actions { gap: 0; }\n\n  .cols-3, .cols-4 { grid-template-columns: 1fr 1fr; }\n  .method { grid-template-columns: 1fr 1fr; gap: 8px 26px; }\n  .step { padding-top: 34px; }\n  .result-grid { grid-template-columns: 1fr 1fr; }\n  .result { border-right: 0; border-bottom: 1px solid var(--line-dark); }\n  .result:nth-child(odd) { border-right: 1px solid var(--line-dark); }\n  .metric-band { grid-template-columns: 1fr 1fr; }\n  .case-grid { grid-template-columns: 1fr 1fr; }\n}\n\n@media (max-width: 760px) {\n  body { font-size: 17px; }\n  .split, .compare, .cta-grid { grid-template-columns: 1fr; }\n  .split--rev { direction: ltr; }\n  .media { aspect-ratio: 16/11; }\n  .cta-grid .form-card { order: -1; }\n  .svc-grid { grid-template-columns: 1fr; }\n  .hero__topline { top: 80px         <p class=\"hero__sub\">L'AI entra nel processo creativo per aumentare velocità e controllo. <b>La direzione resta centrale.<\u002Fb><\u002Fp>\n        <div class=\"btn-row\">\n          <a class=\"btn btn--lg\" href=\"#consulenza\">Richiedi una consulenza <span class=\"btn__arrow\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n          <a class=\"btn btn--lg btn--ghost\" href=\"#metodo\">Scopri il metodo<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"scroll-cue\" aria-hidden=\"true\"><span class=\"bar\"><\u002Fspan> Scroll<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================ TRUST STRIP ============================ -->\n  <section class=\"trust-strip\" aria-label=\"Aziende con cui lavoriamo\">\n    <div class=\"wrap\">\n      <p class=\"label\">Esperienza con aziende strutturate · Loghi clienti in arrivo<\u002Fp>\n      <div class=\"logo-row\" data-stagger=\"70\">\n        <div class=\"logo-ph reveal\">Cliente 01<\u002Fdiv>\n        <div class=\"logo-ph reveal\">Cliente 02<\u002Fdiv>\n        <div class=\"logo-ph reveal\">Cliente 03<\u002Fdiv>\n        <div class=\"logo-ph reveal\">Cliente 04<\u002Fdiv>\n        <div class=\"logo-ph reveal\">Cliente 05<\u002Fdiv>\n        <div class=\"logo-ph reveal\">Cliente 06<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================ CONTEXT (problema) ============================ -->\n  <section class=\"section section--soft\" id=\"contesto\">\n    <div class=\"wrap\">\n      <div class=\"head reveal\">\n        <span class=\"eyebrow\">Il contesto<\u002Fspan>\n        <h2 class=\"h2\">La produzione creativa è diventata complessa<\u002Fh2>\n        <p class=\"lede\">Più output, più canali, meno tempo. La crescita della domanda creativa mette sotto pressione qualità, coerenza e controllo.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"prob-list\" data-stagger=\"120\" style=\"margin-top:clamp(36px,5vw,64px)\">\n        <d PONSE (soluzione) ============================ -->\n  <section class=\"section section--dark grain\" id=\"soluzione\">\n    <div class=\"wrap\">\n      <div class=\"split\">\n        <div class=\"reveal\">\n          <span class=\"eyebrow\">La risposta<\u002Fspan>\n          <h2 class=\"h2\" style=\"margin-top:18px\">Un unico sistema per governare tutto<\u002Fh2>\n          <p class=\"lede\" style=\"margin-top:20px\">Non gestiamo singole produzioni. Costruiamo e guidiamo un sistema integrato — dalla direzione all'output.<\u002Fp>\n          <ul class=\"flist\">\n            <li><span class=\"tick\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M5 12l5 5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fspan> Direzione creativa unica e riconoscibile<\u002Fli>\n            <li><span class=\"tick\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M5 12l5 5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fspan> Produzione integrata: AI + tradizionale<\u002Fli>\n            <li><span class=\"tick\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M5 12l5 5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fspan> Output coordinati e coerenti su ogni canale<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin-top:28px;font-family:var(--font-display);font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1\">Tutto sotto <span class=\"mag\">controllo<\u002Fspan>.<br>Tutto <span class=\"mag\">coerente<\u002Fspan>.<\u002Fp>\n          <div class=\"btn-row\" style=\"margin-top:30px\">\n            <a class=\"btn\" href=\"#consulenza\">Parliamone <span class=\"btn__arrow\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal\" style=\"--d:120ms\">\n          <div class=\"media\">\n            <img src=\"81b0631c-fd02-4a
